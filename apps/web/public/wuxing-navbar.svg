<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FA34D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3FA34D" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="fireGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E5484D" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="earthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8952F" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C8952F" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3FA34D" stop-opacity="0.7"/>
      <stop offset="20%" stop-color="#E5484D" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#C8952F" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#3B82F6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3FA34D" stop-opacity="0.7"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#C8952F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C8952F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底色：白 -->
  <rect x="0" y="0" width="1920" height="200" fill="#FFFFFF"/>

  <!-- 五行分区色块 -->
  <g id="bgSections">
    <rect x="0" y="0" width="384" height="200" fill="url(#woodGradient)"/>
    <rect x="384" y="0" width="384" height="200" fill="url(#fireGradient)"/>
    <rect x="768" y="0" width="384" height="200" fill="url(#earthGradient)"/>
    <rect x="1152" y="0" width="384" height="200" fill="url(#metalGradient)"/>
    <rect x="1536" y="0" width="384" height="200" fill="url(#waterGradient)"/>
  </g>

  <ellipse cx="960" cy="200" rx="700" ry="180" fill="url(#centerGlow)"/>

  <!-- 网格纹理 -->
  <g stroke="#8B5A2B" stroke-width="0.5" fill="none" opacity="0.12">
    <line x1="96" y1="0" x2="96" y2="200"/>
    <line x1="192" y1="0" x2="192" y2="200"/>
    <line x1="288" y1="0" x2="288" y2="200"/>
    <line x1="480" y1="0" x2="480" y2="200"/>
    <line x1="576" y1="0" x2="576" y2="200"/>
    <line x1="672" y1="0" x2="672" y2="200"/>
    <line x1="864" y1="0" x2="864" y2="200"/>
    <line x1="960" y1="0" x2="960" y2="200"/>
    <line x1="1056" y1="0" x2="1056" y2="200"/>
    <line x1="1248" y1="0" x2="1248" y2="200"/>
    <line x1="1344" y1="0" x2="1344" y2="200"/>
    <line x1="1440" y1="0" x2="1440" y2="200"/>
    <line x1="1632" y1="0" x2="1632" y2="200"/>
    <line x1="1728" y1="0" x2="1728" y2="200"/>
    <line x1="1824" y1="0" x2="1824" y2="200"/>
  </g>

  <!-- 五行汉字水印 -->
  <g font-family="'Noto Serif SC', serif" fill-opacity="0.22">
    <text x="192" y="140" font-size="70" text-anchor="middle" fill="#3FA34D">木</text>
    <text x="576" y="140" font-size="70" text-anchor="middle" fill="#E5484D">火</text>
    <text x="960" y="140" font-size="70" text-anchor="middle" fill="#C8952F">土</text>
    <text x="1344" y="140" font-size="70" text-anchor="middle" fill="#D4AF37">金</text>
    <text x="1728" y="140" font-size="70" text-anchor="middle" fill="#3B82F6">水</text>
  </g>

  <!-- 相生流动曲线 -->
  <g stroke="url(#flowGradient)" stroke-width="1.5" fill="none">
    <path d="M0 30 Q240 50, 480 35 Q720 20, 960 45 Q1200 70, 1440 40 Q1680 10, 1920 30" opacity="0.7"/>
    <path d="M0 170 Q240 190, 480 175 Q720 160, 960 185 Q1200 200, 1440 175 Q1680 150, 1920 170" opacity="0.5"/>
  </g>

  <!-- 中央太极圈 -->
  <g transform="translate(960, 100)" opacity="0.15">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#C8952F" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#C8952F" stroke-width="1"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#C8952F" stroke-width="1"/>
  </g>
</svg>
