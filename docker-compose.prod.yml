# ============================================================
#  生产环境（standalone 构建，严格端口隔离）
#  启动：docker compose --env-file .env.docker.prod -f docker-compose.prod.yml up -d --build
#
#  端口策略：
#    - postgres / redis / api 仅 expose 给内部网络，不映射宿主机
#    - 仅 web 映射 WEB_PORT(默认 8080) -> 3000，浏览器通过 ip:8080 访问
#  命名隔离：
#    - 项目级网络：destiny-prod-net
#    - 项目级数据卷：destiny-prod-pgdata / destiny-prod-redisdata
#    - 容器名全部以 destiny-prod- 前缀，与其他项目互不冲突
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: destiny-prod-postgres
    restart: always
    # 密码自愈入口:每次启动时,把数据卷里 destiny 用户的密码强制覆盖为
    # 当前 POSTGRES_PASSWORD 环境变量值,防止改了 .env.docker.prod 后
    # 出现 "password authentication failed for user destiny" 死锁。
    # 注意:用 `sh -c` 显式调用而不是直接 exec,这样即使宿主机上
    # docker/postgres-entrypoint.sh 因为 git 不保留 Windows 的 +x 而拉到
    # ubuntu 后是 644(没有可执行位),sh 也会读取并解释它,不会报
    # "permission denied"。如果脚本带 +x,sh 会按需直接 exec 它(更快)。
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -x /usr/local/bin/postgres-entrypoint.sh ]; then
          exec /usr/local/bin/postgres-entrypoint.sh postgres
        else
          exec sh /usr/local/bin/postgres-entrypoint.sh postgres
        fi
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-destiny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-destiny}
    expose:
      - "5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./docker/postgres-entrypoint.sh:/usr/local/bin/postgres-entrypoint.sh:ro
    networks:
      - destiny-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-destiny}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: destiny-prod-redis
    restart: always
    command: redis-server --appendonly yes --save 60 1
    expose:
      - "6379"
    volumes:
      - redisdata_prod:/data
    networks:
      - destiny-prod-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: destiny-prod-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-destiny}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-destiny}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    expose:
      - "3001"
    networks:
      - destiny-prod-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_PROXY_TARGET: http://api:3001
        NEXT_PUBLIC_API_BASE: /api
    container_name: destiny-prod-web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      # 唯一对外暴露端口：宿主机 WEB_PORT(默认 8080) -> 容器 3000
      - "${WEB_PORT:-8080}:3000"
    networks:
      - destiny-prod-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  destiny-prod-net:
    name: destiny-prod-net
    driver: bridge

volumes:
  pgdata_prod:
    name: destiny-prod-pgdata
  redisdata_prod:
    name: destiny-prod-redisdata